name: CI

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://placeholder-project.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "placeholder-anon-key"
      SUPABASE_URL: "https://placeholder-project.supabase.co"
      SUPABASE_SERVICE_ROLE_KEY: "placeholder-service-role-key"
      REDIS_URL: "redis://127.0.0.1:6379"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Root TypeScript typecheck
        run: pnpm exec tsc --noEmit

      - name: Backend TypeScript typecheck & build
        run: pnpm run build:backend

      - name: Run root unit tests (Vitest)
        run: pnpm test

      - name: Run backend unit tests (Vitest)
        run: pnpm run test:backend

      - name: Run integration tests (Vitest)
        run: pnpm run test:integration

      - name: Build Next.js production bundle
        run: pnpm run build
        env:
          NODE_ENV: production
